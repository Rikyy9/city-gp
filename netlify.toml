[build]
  command = "npm run build"
  publish = "dist"

# the service worker must always be fresh; hashed assets can be cached forever
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
